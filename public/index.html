<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Record table tennis matches between players.">
  <title>Ping Pong Ladder</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><a class="wordmark" href="/">PING PONG<span> / LADDER</span></a></header>
  <main>
    <h1>Record a match</h1>
    <p id="hint" class="hint" aria-live="polite"></p>
    <p id="message" class="message" role="status" hidden></p>

    <section aria-labelledby="who">
      <h2 id="who">1. Who are you?</h2>
      <label for="me">Pick yourself</label>
      <select id="me"></select>
      <form id="player-form">
        <label for="name">Or create a player</label>
        <div class="row"><input id="name" maxlength="60" autocomplete="off" placeholder="Your name" required><button>Create player</button></div>
      </form>
    </section>

    <section aria-labelledby="record" id="record-section">
      <h2 id="record">2. Record a finished match</h2>
      <form id="match-form">
        <label for="opponent">Opponent</label>
        <select id="opponent"></select>
        <div class="row scores">
          <div><label for="my-score">Your games won</label><input id="my-score" type="number" min="0" step="1" inputmode="numeric" required></div>
          <div><label for="their-score">Their games won</label><input id="their-score" type="number" min="0" step="1" inputmode="numeric" required></div>
        </div>
        <button>Record match</button>
      </form>
    </section>

    <section aria-labelledby="matches">
      <h2 id="matches">Matches</h2>
      <p id="empty-matches" class="hint" hidden>No matches yet.</p>
      <ul id="match-list" class="matches"></ul>
    </section>
  </main>
  <footer><span>Honour system: nothing stops you picking someone else.</span><a href="/api/health">Check this app</a></footer>
  <script src="/app.js"></script>
</body>
</html>
